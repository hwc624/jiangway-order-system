// 解析中文時間字串為時間戳（用於排序）
// 例如 "2026/5/7 上午10:48:20" → 數字
function parseTs(ts){
  if(!ts) return 0;
  try{
    // 拆解日期跟時間
    const parts=ts.trim().split(" ");
    if(parts.length<2) return new Date(ts).getTime()||0;
    const dateStr=parts[0]; // "2026/5/7"
    let timeStr=parts[1];   // "上午10:48:20" 或 "下午4:30:54"
    
    // 處理上午/下午
    let isPM=false;
    if(timeStr.startsWith("下午")){
      isPM=true;
      timeStr=timeStr.replace("下午","");
    } else if(timeStr.startsWith("上午")){
      timeStr=timeStr.replace("上午","");
    }
    
    const [y,m,d]=dateStr.split("/").map(Number);
    const [hh,mm,ss]=timeStr.split(":").map(Number);
    let hour=hh;
    if(isPM&&hour<12) hour+=12;
    if(!isPM&&hour===12) hour=0;
    
    return new Date(y,m-1,d,hour,mm||0,ss||0).getTime();
  }catch(e){
    return new Date(ts).getTime()||0;
  }
}

// 訂單日期 key（YYYY-MM-DD）：新訂單用 dateKey；舊訂單從 ts（例如 "2026/5/7 上午10:48:20"）解析
function orderDateKey(o){
  if(o&&o.dateKey) return o.dateKey;
  if(!o||!o.ts) return "未知日期";
  const datePart=String(o.ts).trim().split(" ")[0];
  const nums=datePart.split(/[\/\-]/).map(x=>parseInt(x,10));
  if(nums.length<3||nums.some(isNaN)) return datePart;
  return `${nums[0]}-${String(nums[1]).padStart(2,"0")}-${String(nums[2]).padStart(2,"0")}`;
}

// 營業時間：週一至週六 10:30–19:00，週日公休
function isOpenNow(){
  const n=new Date(),day=n.getDay(),m=n.getHours()*60+n.getMinutes();
  return day!==0&&m>=10*60+30&&m<19*60;
}
function getDates(){
  const d=[];
  const now=new Date();
  // 正規化到當天中午 12:00（避免午夜時區/DST 邊界造成跳日）
  const cur=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0,0);
  while(d.length<12){
    if(cur.getDay()!==0)d.push(new Date(cur)); // 跳過週日
    cur.setDate(cur.getDate()+1);
  }
  return d;
}
const fmtDate=d=>d.toLocaleDateString("zh-TW",{month:"short",day:"numeric",weekday:"short"});
// fmtKey 用本地時區（不用 toISOString，因為那會轉成 UTC 造成跨時區跳日 bug）
const fmtKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isToday=d=>fmtKey(d)===fmtKey(new Date());
function getSlots(dt){
  const now=new Date(),slots=[],td=isToday(dt);
  if(dt.getDay()===0)return []; // 週日公休
  const openMin=10*60+30,closeMin=19*60;
  if(td){
    const nowMin=now.getHours()*60+now.getMinutes();
    if(nowMin>=openMin&&nowMin<closeMin)slots.push("盡快 ASAP");
  }
  for(let t=openMin;t<closeMin;t+=15){ // 19:00 打烊，最後一個時段 18:45
    if(td){const sd=new Date(now);sd.setHours(Math.floor(t/60),t%60,0,0);if(sd<=new Date(now.getTime()+600000))continue;}
    slots.push(`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`);
  }
  return slots;
}
const itemDiscPrice=(price,pct)=>Math.round(price*(1-(Number(pct)||0)/100));
function calcPromo(items,qty,promos){
  let disc=0;const discLines=[],addonList=[];
  const sub=items.reduce((s,i)=>s+i.price*qty(i.id),0);
  promos.filter(p=>p.active).forEach(p=>{
    if(p.type==="order_discount"){const d=Math.round(sub*(p.pct/100));disc+=d;discLines.push(`🎉 ${p.label}：-R${d}`);}
    // 品項折扣：先算「每份折後價」（四捨五入），再乘數量，跟菜單上顯示的折後價一致
    if(p.type==="item_discount"){items.filter(i=>i.id===p.itemId).forEach(i=>{const d=(i.price-itemDiscPrice(i.price,p.pct))*qty(i.id);disc+=d;discLines.push(`🎉 ${p.label}：-R${d}`);});}
    if(p.type==="addon")addonList.push(p);
  });
  return{disc,discLines,addonList};
}

// 後台用：依「目前」菜單（含改價、新商品）、促銷、外送費重新計算訂單應收金額，抓出被竄改的訂單
function repriceOrder(o,menuItems,promos,delivFee){
  const issues=[];
  const qmap={},pmap={};
  (o.items||[]).forEach(it=>{
    const q=Number(it.qty)||0;
    const m=(it.id&&menuItems.find(x=>x.id===it.id))||menuItems.find(x=>x.name===it.name);
    if(!m){
      issues.push(`找不到品項「${it.name}」（以客人提交的單價 R${it.price} 計）`);
      const k="?"+it.name; qmap[k]=(qmap[k]||0)+q; pmap[k]=Number(it.price)||0; return;
    }
    if(Number(it.price)!==m.price) issues.push(`${m.name} 單價 R${it.price}（菜單 R${m.price}）`);
    qmap[m.id]=(qmap[m.id]||0)+q; pmap[m.id]=m.price;
  });
  const items=Object.keys(qmap).map(id=>({id,price:pmap[id]}));
  const qf=id=>qmap[id]||0;
  const sub=items.reduce((s,i)=>s+i.price*qf(i.id),0);
  const {disc,addonList}=calcPromo(items,qf,promos);
  if((Number(o.disc)||0)>disc+1) issues.push(`折扣 R${o.disc}（依目前促銷應為 R${disc}）`);
  let addons=0;
  (o.addons||[]).forEach(a=>{
    const p=addonList.find(x=>x.addonName===a.addonName);
    const price=p?Number(p.addonPrice)||0:Number(a.addonPrice)||0;
    if(!p) issues.push(`加價購「${a.addonName}」目前沒有此促銷`);
    else if(Number(a.addonPrice)!==price) issues.push(`加價購「${a.addonName}」R${a.addonPrice}（應為 R${price}）`);
    addons+=price*(Number(a.qty)||0);
  });
  let fee=0;
  if(o.pickup==="外送"){
    const dN=parseFloat(o.distance);
    const free=(sub-disc+addons)>=1500&&Number.isFinite(dN)&&dN>0&&dN<=5;
    fee=free?0:(Number(delivFee)||0);
    if((Number(o.fee)||0)!==fee) issues.push(`外送費 R${Number(o.fee)||0}（應為 R${fee}）`);
  }
  const expected=sub-disc+addons+fee;
  const submitted=Number(o.total);
  const totalMismatch=!Number.isFinite(submitted)||Math.abs(submitted-expected)>1;
  return {expected,submitted,issues,flag:totalMismatch||issues.length>0,totalMismatch};
}

function AnalyticsTab({orders,BORDER,RED,NAVY,DARK}){
  const [aFilter,setAFilter]=useState("item");
  const [aDate,setADate]=useState("");
  const [aSort,setASort]=useState("rev");

  const filtered=orders.filter(o=>{
    if(aDate){
      // <input type="date"> 的值是 "YYYY-MM-DD"，所以用同格式的 dateKey 比對（舊訂單從 ts 換算）
      if(orderDateKey(o)!==aDate)return false;
    }
    return true;
  });

  // 總覽
  const totalRev=filtered.reduce((s,o)=>s+(Number(o.total)||0),0);
  const totalOrders=filtered.length;
  const avgOrder=totalOrders>0?Math.round(totalRev/totalOrders):0;

  // 品項分析
  const itemMap={};
  filtered.forEach(o=>{
    if(o.items){
      o.items.forEach(i=>{
        if(!itemMap[i.name])itemMap[i.name]={name:i.name,qty:0,rev:0};
        itemMap[i.name].qty+=Number(i.qty)||0;
        itemMap[i.name].rev+=(Number(i.price)||0)*(Number(i.qty)||0);
      });
    }
  });
  const itemList=Object.values(itemMap).sort((a,b)=>aSort==="qty"?b.qty-a.qty:b.rev-a.rev);

  // 客戶分析
  const custMap={};
  filtered.forEach(o=>{
    const k=o.name||"未知";
    if(!custMap[k])custMap[k]={name:k,orders:0,total:0};
    custMap[k].orders+=1;
    custMap[k].total+=Number(o.total)||0;
  });
  const custList=Object.values(custMap).sort((a,b)=>b.total-a.total);

  // 每日分析
  const dayMap={};
  filtered.forEach(o=>{
    const d=orderDateKey(o);
    if(!dayMap[d])dayMap[d]={date:d,orders:0,total:0};
    dayMap[d].orders+=1;
    dayMap[d].total+=Number(o.total)||0;
  });
  const dayList=Object.values(dayMap).sort((a,b)=>b.date.localeCompare(a.date));

  const Card=({label,val,sub})=>(
    <div style={{flex:1,background:"#fff",borderRadius:10,padding:"14px 12px",border:`1px solid ${BORDER}`,textAlign:"center"}}>
      <div style={{fontSize:11,color:"#888",marginBottom:4}}>{label}</div>
      <div style={{fontSize:20,fontWeight:500,color:NAVY}}>{val}</div>
      {sub&&<div style={{fontSize:11,color:"#aaa",marginTop:2}}>{sub}</div>}
    </div>
  );

  return(
    <div>
      <div style={{fontSize:14,fontWeight:500,color:NAVY,marginBottom:12}}>📊 銷售分析 Sales Analytics <span id="analyticsCount" style={{fontSize:11,color:"#888",fontWeight:400}}>（全部 {orders.length} 筆訂單）</span></div>

      {/* 日期篩選 */}
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
        <div style={{fontSize:12,color:"#777",flexShrink:0}}>篩選日期</div>
        <input type="date" value={aDate} onChange={e=>setADate(e.target.value)} style={{flex:1,padding:"8px 10px",borderRadius:8,border:`1.5px solid ${BORDER}`,fontSize:13,background:"#fff",color:DARK}}/>
        {aDate&&<button onClick={()=>setADate("")} style={{padding:"8px 12px",borderRadius:8,border:`1.5px solid ${BORDER}`,background:"#fff",color:"#888",fontSize:12,cursor:"pointer"}}>清除</button>}
      </div>

      {/* 總覽卡片 */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <Card label="總營業額 Revenue" val={`R${totalRev}`}/>
        <Card label="訂單數 Orders" val={totalOrders}/>
        <Card label="平均客單 Avg" val={`R${avgOrder}`}/>
      </div>

      {/* 分頁切換 */}
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        {[["item","品項"],["customer","客戶"],["day","每日"]].map(([k,l])=>(
          <button key={k} onClick={()=>setAFilter(k)} style={{flex:1,padding:"8px 4px",borderRadius:8,border:`1.5px solid ${aFilter===k?NAVY:BORDER}`,background:aFilter===k?NAVY:"#fff",color:aFilter===k?"#fff":DARK,fontSize:12,fontWeight:aFilter===k?500:400,cursor:"pointer"}}>{l}</button>
        ))}
      </div>

      {/* 品項分析 */}
      {aFilter==="item"&&<div style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:500,color:NAVY}}>🔥 熱銷品項 Top Items</div>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>setASort("rev")} style={{padding:"4px 10px",borderRadius:6,border:`1.5px solid ${aSort==="rev"?RED:BORDER}`,background:aSort==="rev"?"#FDF0EE":"#fff",color:aSort==="rev"?RED:"#888",fontSize:11,cursor:"pointer"}}>金額</button>
            <button onClick={()=>setASort("qty")} style={{padding:"4px 10px",borderRadius:6,border:`1.5px solid ${aSort==="qty"?RED:BORDER}`,background:aSort==="qty"?"#FDF0EE":"#fff",color:aSort==="qty"?RED:"#888",fontSize:11,cursor:"pointer"}}>數量</button>
          </div>
        </div>
        {itemList.length===0&&<div style={{textAlign:"center",color:"#aaa",fontSize:13,padding:"20px 0"}}>📭 暫無資料</div>}
        {itemList.map((item,idx)=>{
          const maxRev=itemList[0]?.rev||1;
          const pct=Math.round((item.rev/maxRev)*100);
          return(
            <div key={item.name} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:6,border:`1px solid ${BORDER}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:11,background:idx===0?"#FFF3CD":idx===1?"#F0F0F0":"#F9F0FF",color:idx===0?"#7A5800":idx===1?"#555":"#6B3FA0",borderRadius:4,padding:"1px 6px",fontWeight:500}}>#{idx+1}</span>
                  <span style={{fontSize:13,fontWeight:500,color:DARK}}>{item.name}</span>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:13,fontWeight:500,color:RED}}>R{item.rev}</div>
                  <div style={{fontSize:11,color:"#888"}}>{item.qty} 份</div>
                </div>
              </div>
              <div style={{height:4,background:"#F0F0F0",borderRadius:2}}>
                <div style={{height:4,background:RED,borderRadius:2,width:`${pct}%`,transition:"width 0.3s"}}/>
              </div>
            </div>
          );
        })}
      </div>}

      {/* 客戶分析 */}
      {aFilter==="customer"&&<div style={{marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:500,color:NAVY,marginBottom:8}}>👥 客戶分析 Customers</div>
        {custList.length===0&&<div style={{textAlign:"center",color:"#aaa",fontSize:13,padding:"20px 0"}}>📭 暫無資料</div>}
        {custList.map((c,idx)=>(
          <div key={c.name} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:6,border:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:13,fontWeight:500,color:DARK}}>{c.name}</div>
              <div style={{fontSize:11,color:"#888",marginTop:2}}>{c.orders} 次訂購</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:14,fontWeight:500,color:RED}}>R{c.total}</div>
              <div style={{fontSize:11,color:"#aaa"}}>平均 R{Math.round(c.total/c.orders)}/次</div>
            </div>
          </div>
        ))}
      </div>}

      {/* 每日分析 */}
      {aFilter==="day"&&<div style={{marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:500,color:NAVY,marginBottom:8}}>📈 每日銷售 Daily Sales</div>
        {dayList.length===0&&<div style={{textAlign:"center",color:"#aaa",fontSize:13,padding:"20px 0"}}>📭 暫無資料</div>}
        {dayList.map(d=>(
          <div key={d.date} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:6,border:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:13,fontWeight:500,color:DARK}}>{d.date}</div>
              <div style={{fontSize:11,color:"#888",marginTop:2}}>{d.orders} 筆訂單</div>
            </div>
            <div style={{fontSize:14,fontWeight:500,color:RED}}>R{d.total}</div>
          </div>
        ))}
      </div>}
    </div>
  );
}

        const result=await Promise.race([

      eftProof,
      ts:new Date().toLocaleString("zh-TW")

          {selDate&&<><Lbl t={pickup==="內用"?"預計用餐時間 Dining Time":"預計取餐時間 Pickup Time"}/><select value={time} onChange={e=>setTime(e.target.value)} style={{...IS,color:time?DARK:"#999",fontSize:14}}><option value="">請選擇時間 Select time</option>{slots.map(t=><option key={t} value={t}>{t}</option>)}</select></>}
          <Lbl t="付款方式 Payment Method"/>
          <div style={{display:"flex",gap:8,marginTop:6}}>
            <SBtn label="現金 Cash" active={pay==="現金"} onClick={()=>setPay("現金")}/>
            <SBtn label="EFT" active={pay==="EFT"} onClick={()=>setPay("EFT")}/>
            <SBtn label="餐券 Voucher" active={pay==="餐券"} onClick={()=>setPay("餐券")}/>
          </div>
          {pay==="EFT"&&<div style={{background:"#F0F7FF",border:"1.5px solid #B5D4F4",borderRadius:12,padding:"12px 14px",marginTop:10}}>
            <div style={{fontSize:13,fontWeight:500,color:"#0C447C",marginBottom:8}}>🏦 EFT Banking Details</div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"#555"}}>Bank</span><span style={{fontSize:13,fontWeight:500,color:"#0C447C"}}>Capitec Business</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"#555"}}>Acc Name</span><span style={{fontSize:13,fontWeight:500,color:"#0C447C"}}>Intelage Trading cc</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"#555"}}>Acc No</span><span style={{fontSize:13,fontWeight:500,color:"#0C447C"}}>1055134590</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"#555"}}>Branch Code</span><span style={{fontSize:13,fontWeight:500,color:"#0C447C"}}>450105</span></div>
            <div style={{fontSize:11,color:"#888",marginTop:8,borderTop:"1px solid #B5D4F4",paddingTop:8}}>請以姓名作為付款參考 Use your name as reference</div>
            <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #B5D4F4"}}>
              <div style={{fontSize:12,fontWeight:500,color:"#0C447C",marginBottom:8}}>📸 付款後上傳證明 Upload Proof of Payment</div>
              <input 
                type="text" 
                value={eftProof}
                onChange={e=>setEftProof(e.target.value)}
                placeholder="貼上證明圖片連結或描述 Paste proof image URL or describe" 
                maxLength={500}
                style={{...IS,fontSize:13}}
              />
              <div style={{fontSize:11,color:"#888",marginTop:6}}>⚠️ 上傳付款證明後才能出餐 Food will be prepared after proof is submitted</div>
            </div>
          </div>}
          <Lbl t="備註 Remarks（選填 Optional）"/><textarea maxLength={500} defaultValue={noRef.current} onChange={e=>{noRef.current=e.target.value;}} placeholder="例：不要辣、少油... e.g. No spicy" style={{...IS,minHeight:68,resize:"vertical"}}/>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button onClick={()=>setStep(2)} style={{padding:"12px 18px",borderRadius:10,border:`1.5px solid ${BORDER}`,background:"#fff",color:DARK,fontSize:13,cursor:"pointer"}}>← 返回 Back</button>
            <button onClick={go4} style={{background:RED,color:"#fff",border:"none",borderRadius:10,padding:"12px 24px",fontSize:14,fontWeight:500,cursor:"pointer",marginTop:8,boxShadow:BTN_SHADOW}}>確認訂單 Confirm →</button>
          </div>
        </div>}

        {step===4&&<div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div className="ttl" style={{marginBottom:0}}>訂單確認 Order Summary</div>
            <div id="confirmOrdNo" style={{background:"#eee",color:"#888",borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:500}}>訂單編號：提交後產生</div>
          </div>
          <div style={{background:"#fff",border:`1.5px solid ${BORDER}`,borderRadius:14,padding:"16px 14px",marginBottom:16,boxShadow:CARD_SHADOW}}>
            <Row label="顧客 Customer" val={`${nameVal}${phoneVal?` · ${phoneVal}`:""}`}/>
            <Row label="取餐 Pickup" val={`${pickLbl()}${pickup==="外送"&&addr?`：${addr}`:""}`}/>
            {pickup==="外送"&&distance&&<Row label="距離 Distance" val={`${distance} km`}/>}
            {selDate&&<Row label="日期 Date" val={isToday(selDate)?"今天 Today":fmtDate(selDate)}/>}
            {time&&<Row label="時間 Time" val={time}/>}
            <Row label="付款 Payment" val={payLbl()}/>
            {pay==="EFT"&&eftProof&&<Row label="付款證明 Proof" val={eftProof}/>}
            <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:12,marginTop:4}}>
              {cartItems.map(i=>(
                <div key={i.id} style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:13}}>{i.name} <span style={{color:"#999",fontSize:11}}>{i.nameEn}</span> × {qty(i.id)}</span>
                  <span style={{fontSize:13}}>R{i.price*qty(i.id)}</span>
                </div>
              ))}
              {addonList.filter(p=>(addonQty[p.id]||0)>0).map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:13,color:"#7A5800"}}>＋{p.addonName} × {addonQty[p.id]}</span>
                  <span style={{fontSize:13,color:"#7A5800"}}>+R{p.addonPrice*addonQty[p.id]}</span>
                </div>
              ))}
              {discLines.map((l,i)=><div key={i} style={{fontSize:12,color:"#27AE60",marginBottom:4}}>{l}</div>)}
              {fee>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,color:"#888"}}>外送費</span><span style={{fontSize:13}}>+R{fee}</span></div>}
              {isFreeDelivery&&pickup==="外送"&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4,color:"#27AE60"}}><span style={{fontSize:12}}>✨ 免費外送</span><span style={{fontSize:13,fontWeight:500}}>-R0</span></div>}
              <div style={{borderTop:`1px solid ${BORDER}`,marginTop:8,paddingTop:8}}>
                {disc>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,color:"#888"}}>小計</span><span style={{fontSize:13,color:"#888",textDecoration:"line-through"}}>R{sub}</span></div>}
                <div style={{display:"flex",justifyContent:"space-between"}}><span className="serif" style={{fontSize:16,fontWeight:700}}>合計 Total</span><span style={{fontSize:18,fontWeight:700,color:RED}}>R{total}</span></div>
              </div>
            </div>
            {note&&<div style={{marginTop:10,fontSize:12,color:"#666",borderTop:`1px solid ${BORDER}`,paddingTop:8}}>備註：{note}</div>}
          </div>
          <div style={{background:"#F5F5F5",borderRadius:12,padding:"12px 14px",marginBottom:14,fontFamily:"monospace",fontSize:12,whiteSpace:"pre-wrap",color:DARK,lineHeight:1.7}}>{orderTxt()}</div>
          <button onClick={sendWA} disabled={submitting} style={{width:"100%",padding:"14px",borderRadius:10,border:"none",background:submitting?"#9BDDB5":"#25D366",color:"#fff",fontSize:15,fontWeight:700,cursor:submitting?"not-allowed":"pointer",marginBottom:6,boxShadow:submitting?"none":"0 3px 10px rgba(37,211,102,0.3)"}}>{submitting?"處理中… Processing…":"✓ 提交並傳送 WhatsApp"}</button>
          <div style={{fontSize:11,color:"#8A7560",textAlign:"center",marginBottom:12}}>提交後會自動開啟 WhatsApp，請按「傳送」完成下單<br/>After submitting, WhatsApp will open — tap Send to complete your order</div>
          <button onClick={copy} style={{width:"100%",padding:"12px",borderRadius:10,border:`2px solid ${copied?"#27AE60":RED}`,background:copied?"#27AE60":"#fff",color:copied?"#fff":RED,fontSize:13,fontWeight:500,cursor:"pointer",marginBottom:10}}>{copied?"✓ 已複製！Copied!":"複製訂單文字 Copy Text"}</button>
          <button onClick={reset} style={{width:"100%",padding:"12px",borderRadius:10,border:`1.5px solid ${BORDER}`,background:"#fff",color:"#888",fontSize:13,cursor:"pointer"}}>+ 新增訂單 New Order</button>
        </div>}
        {step===5&&<div>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{fontSize:48,marginBottom:8}}>{saveStatus==="ok"?"✅":"⚠️"}</div>
            <div className="serif" style={{fontSize:22,fontWeight:700,color:saveStatus==="ok"?"#27AE60":"#E67E22",marginBottom:6}}>{saveStatus==="ok"?"訂單已提交！":"請用 WhatsApp 傳送訂單"}</div>
            <div style={{fontSize:14,color:saveStatus==="ok"?"#27AE60":"#E67E22",marginBottom:14}}>{saveStatus==="ok"?"Order Submitted!":"Please send your order via WhatsApp"}</div>
            <div style={{background:RED,color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:15,fontWeight:500,display:"inline-block"}}>訂單編號 #{ordNo}</div>
          </div>
          
          {saveStatus!=="ok"&&<div id="saveWarn" style={{background:"#FFE8E8",border:`2px solid ${RED}`,borderRadius:14,padding:"14px 16px",marginBottom:16,fontSize:13,color:RED,lineHeight:1.6}}>
            {saveStatus==="timeout"
              ?<>⚠️ 網路較慢，訂單<strong>可能尚未存入</strong>店家系統。請務必按下方綠色按鈕用 WhatsApp 傳送訂單，店家才會收到。<br/><span style={{fontSize:12}}>Your order may not have been saved yet (slow network). Please tap the green button to send it via WhatsApp.</span></>
              :<>⚠️ 訂單<strong>未能存入</strong>店家系統（可能是網路問題）。請務必按下方綠色按鈕用 WhatsApp 傳送訂單，並截圖此畫面。<br/><span style={{fontSize:12}}>Your order could not be saved. Please tap the green button to send it via WhatsApp and take a screenshot.</span></>}
          </div>}
          <div style={{background:"#FFF9E6",border:`2px solid #F39C12`,borderRadius:14,padding:"16px",marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:"#7A5800",marginBottom:8}}>{saveStatus==="ok"?"📱 正在開啟 WhatsApp… Opening WhatsApp…":"📱 請按下方按鈕開啟 WhatsApp"}</div>
            <div style={{fontSize:12,color:"#7A5800",lineHeight:1.6,marginBottom:10}}>請在 WhatsApp 裡按<strong>「傳送」</strong>把訂單送給店家，我們收到後才會開始準備您的餐點。</div>
            <div style={{fontSize:12,color:"#7A5800",lineHeight:1.6}}>Please tap <strong>Send</strong> in WhatsApp to deliver your order to us. We will start preparing once we receive it.</div>
          </div>
          
          {/* 如果沒有自動跳轉，可以手動按這個按鈕 */}
          <a 
            href={`https://wa.me/${WA}?text=${encodeURIComponent(submittedTxt||orderTxt(ordNo))}`}
            style={{
              display:"block",
              width:"100%",
              padding:"16px",
              borderRadius:12,
              background:"#25D366",
              color:"#fff",
              fontSize:16,
              fontWeight:700,
              textAlign:"center",
              textDecoration:"none",
              marginBottom:12,
              boxShadow:"0 3px 10px rgba(37,211,102,0.3)"
            }}
          >
            📱 沒有跳轉？點此打開 WhatsApp
            <div style={{fontSize:12,marginTop:4,opacity:0.9,fontWeight:400}}>Not redirected? Tap to open WhatsApp</div>
          </a>
          
          {/* 備案：複製訂單文字 */}
          <button 
            onClick={()=>{
              const txt=submittedTxt||orderTxt(ordNo);
              if(navigator.clipboard){
                navigator.clipboard.writeText(txt).then(()=>{
                  setCopied(true);
                  setTimeout(()=>setCopied(false),2500);
                });
              }else{
                const t=document.createElement("textarea");
                t.value=txt;document.body.appendChild(t);t.select();
                document.execCommand("copy");document.body.removeChild(t);
                setCopied(true);
                setTimeout(()=>setCopied(false),2500);
              }
            }} 
            style={{width:"100%",padding:"12px",borderRadius:10,border:`2px solid ${copied?"#27AE60":"#888"}`,background:copied?"#27AE60":"#fff",color:copied?"#fff":"#666",fontSize:13,fontWeight:500,cursor:"pointer",marginBottom:10}}
          >
            {copied?"✓ 已複製！可以手動貼到 WhatsApp":"📋 或：複製訂單文字（手動貼到 WhatsApp）"}
          </button>
          
          {isInAppBrowser()&&<div style={{background:"#FFE8E8",border:`1px solid ${RED}`,borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:RED,lineHeight:1.5}}>
            ⚠️ 偵測到您在 App 內建瀏覽器（如 WeChat、Facebook、Instagram、Line）。如果沒有自動跳轉到 WhatsApp，請：<br/>
            1. 點上方「📋 複製訂單文字」<br/>
            2. 打開 WhatsApp 搜尋「江味齋」<br/>
            3. 長按輸入框→貼上→發送
          </div>}
          
          <button onClick={reset} style={{width:"100%",padding:"12px",borderRadius:10,border:`1.5px solid ${BORDER}`,background:"#fff",color:"#888",fontSize:13,cursor:"pointer",marginTop:10}}>+ 新增訂單 New Order</button>
        </div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

// PWA Service Worker 註冊（強制檢查更新）
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    console.log("✅ Service Worker 已註冊");
    
    // 每次載入時主動檢查更新
    reg.update();
    
    // 偵測到新版本時，自動套用
    reg.addEventListener("updatefound", ()=>{
      const newWorker = reg.installing;
      if(newWorker){
        newWorker.addEventListener("statechange", ()=>{
          if(newWorker.state === "installed" && navigator.serviceWorker.controller){
            console.log("🆕 偵測到新版本，正在套用...");
            // 通知新 SW 立即接管
            newWorker.postMessage("SKIP_WAITING");
          }
        });
      }
    });
    
    // 當新 SW 接管時，自動重新載入頁面
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshing) return;
      refreshing = true;
      console.log("🔄 重新載入以套用新版本");
      window.location.reload();
    });
  }).catch(err=>{
    console.warn("⚠️ Service Worker 註冊失敗:", err);
  });
}
</script>
</body>
</html>
