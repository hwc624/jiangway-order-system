// 解析中文時間字串為時間戳（用於排序）
// 支援 "2026/5/7 上午10:48:20"、"2026/5/7 晚上 9:05:00"、"2026/5/7 21:05:00"、凌晨/清晨/中午/下午，
// 以及 U+202F / NBSP 等特殊空白；無法解析一律回傳 0（絕不回傳 NaN）
function parseTs(ts){
  try{
    if(!ts||typeof ts!=="string") return 0;
    const t=ts.replace(/[\u00A0\u202F\u2007\u2009\u3000]/g," ").replace(/\s+/g," ").trim();
    const m=t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})[,，]?\s*(凌晨|清晨|早上|上午|中午|下午|晚上|AM|PM|am|pm)?\s*(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?\s*(AM|PM|am|pm)?/);
    if(!m){ const v=new Date(t).getTime(); return isFinite(v)?v:0; }
    const y=+m[1],mo=+m[2],d=+m[3];
    let h=+m[5]; const mi=+m[6], se=+(m[7]||0);
    const per=(m[4]||m[8]||"").toUpperCase();
    if(["下午","晚上","PM"].includes(per)){ if(h<12) h+=12; }
    else if(per==="中午"){ if(h<11) h+=12; }          // 中午12:30 → 12；中午1:00 → 13
    else if(["凌晨","清晨","早上","上午","AM"].includes(per)){ if(h===12) h=0; }
    const v=new Date(y,mo-1,d,h,mi,se).getTime();
    return isFinite(v)?v:0;
  }catch(e){ return 0; }
}
// 訂單排序（新→舊）：時間相同或無法解析時，用 Firebase push key（依時間排序）當備援，保證排序穩定
function cmpOrdersDesc(a,b){
  const d=parseTs(b&&b.ts)-parseTs(a&&a.ts);
  if(d) return d;
  const ka=(a&&a._fbKey)||"", kb=(b&&b._fbKey)||"";
  return ka<kb?1:ka>kb?-1:0;
}

// ===== 可靠存單：失敗/逾時自動重試；伺服器確認前，每筆訂單各自完整保存在客人手機（jw_pending_orders，以 push key 為索引的多筆佇列），同一個 key 絕不重複 =====
// 每筆：{key,order,txt,savedAt,sent:是否曾經送出過 set(),status:"pending"|"rejected"|"unsure"}
const QUEUE_KEY="jw_pending_orders", OLD_PENDING_KEY="jw_pending_order";
const PENDING_MAX_AGE=3*24*3600*1000;
function loadQueue(){
  let q={};
  try{ const v=JSON.parse(localStorage.getItem(QUEUE_KEY)||"{}"); if(v&&typeof v==="object"&&!Array.isArray(v)) q=v; }catch(e){}
  // 舊版單格格式 → 搬進佇列（舊格式不知道是否送出過，保守當作「曾送出」，被拒時只會顯示「可能已送達」）
  try{
    const o=JSON.parse(localStorage.getItem(OLD_PENDING_KEY)||"null");
    if(o&&o.key&&o.order){ if(!q[o.key]) q[o.key]={...o,sent:true,status:"pending"}; localStorage.setItem(QUEUE_KEY,JSON.stringify(q)); }
    localStorage.removeItem(OLD_PENDING_KEY);
  }catch(e){}
  for(const k of Object.keys(q)){ const e=q[k]; if(!e||!e.key||!e.order) delete q[k]; }
  return q;
}
function writeQueue(q){ try{ localStorage.setItem(QUEUE_KEY,JSON.stringify(q)); }catch(e){} }
function getPending(key){ return loadQueue()[key]||null; }
function savePending(v){ const q=loadQueue(); q[v.key]={sent:false,status:"pending",...q[v.key],...v}; writeQueue(q); }
function updatePending(key,patch){ const q=loadQueue(); if(q[key]){ q[key]={...q[key],...patch}; writeQueue(q); } }
function clearPending(key){ if(!key) return; const q=loadQueue(); if(q[key]){ delete q[key]; writeQueue(q); } }
// 跨分頁：記下「伺服器已確認」的 key（保留 3 天），別的分頁之後拿到 PERMISSION_DENIED 時可判成已存好，不會誤顯示「可能已送達」
const CONFIRMED_KEY="jw_confirmed_orders";
function loadConfirmed(){ try{ const v=JSON.parse(localStorage.getItem(CONFIRMED_KEY)||"{}"); return (v&&typeof v==="object"&&!Array.isArray(v))?v:{}; }catch(e){ return {}; } }
function markConfirmed(key){ try{ const c=loadConfirmed(), now=Date.now(); c[key]=now; for(const k of Object.keys(c)) if(!(now-c[k]<PENDING_MAX_AGE)) delete c[k]; localStorage.setItem(CONFIRMED_KEY,JSON.stringify(c)); }catch(e){} }
function isConfirmed(key){ return !!loadConfirmed()[key]; }
// 同時只讓一個分頁補送：優先 navigator.locks；不支援時用 localStorage 租約（每 5 秒續約，15 秒沒續約視為失效）
const TAB_ID=Math.random().toString(36).slice(2);
async function withFlushLock(fn){
  if(navigator.locks&&navigator.locks.request) return navigator.locks.request("jw_flush_queue",fn);
  const LK="jw_flush_lease", read=()=>{ try{ return JSON.parse(localStorage.getItem(LK)||"null"); }catch(e){ return null; } };
  for(;;){ const l=read(); if(!l||l.owner===TAB_ID||l.until<Date.now()) break; await sleep(500); }
  const put=()=>{ try{ localStorage.setItem(LK,JSON.stringify({owner:TAB_ID,until:Date.now()+15000})); }catch(e){} };
  put(); const t=setInterval(put,5000);
  try{ return await fn(); } finally{ clearInterval(t); const l=read(); if(l&&l.owner===TAB_ID) localStorage.removeItem(LK); }
}
// 去掉 undefined / NaN 等 Firebase 不接受的值，避免 set() 同步丟錯
function cleanForDb(o){ return JSON.parse(JSON.stringify(o,(k,v)=>(typeof v==="number"&&!isFinite(v))?undefined:v)); }
// 備援編號＝"9"+3 位數（4 碼）。正常編號也可能到 9000 以上，所以已知當天已發號數 n 時，只有大於 n 的 9xxx 才算備援
function isFbNo(no,n){ const s=String(no||""); if(!/^9[0-9]{3}$/.test(s)) return false; return !(Number.isFinite(n)&&parseInt(s,10)<=n); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 回傳 "ok"（伺服器已確認）/ "rejected"（從沒送出過就被規則拒絕＝確定沒存）/ "unsure"（曾送出過、這次被拒：可能先前已存好，也可能資料被拒，客人無讀取權限無法分辨）/ "timeout"（仍未確認，留在手機待重試）
// 只有 "ok" 會把訂單從手機佇列移除；"rejected"/"unsure" 會保留，直到客人自己關掉提示
const inflight={}; // 同一頁面裡同一個 key 只會有一個 set() 在跑
// 連線中斷次數：set() 送出後若曾斷線，SDK 會在重連後自動重送；若第一次其實已存好（只是回覆沒收到），重送會被拒，此時不能斷定是「被拒收」
let connDrops=0, connWatch=false;
function watchConn(){ if(connWatch||!window.fbDb) return; connWatch=true; let was=false;
  window.fbDb.ref(".info/connected").on("value",s=>{ const v=s.val()===true; if(was&&!v) connDrops++; was=v; }); }
async function saveOrderReliably(key,order,{attempts=3,waits=[4000,8000,15000],onStatus}={}){
  if(!window.fbDb) return "timeout";
  const ref=window.fbDb.ref(`orders/${key}`);
  for(let i=0;i<attempts;i++){
    if(!inflight[key]){
      const ent=getPending(key);
      watchConn();
      const sentBefore=!!(ent?ent.sent:true), drops0=connDrops;
      if(ent&&!ent.sent) updatePending(key,{sent:true});
      let pr;
      try{ pr=ref.set(cleanForDb(order)); }
      catch(e){ console.error("❌ set() 同步錯誤:",e.message); pr=Promise.reject(e); }
      inflight[key]=pr.then(()=>"ok",err=>{
        const code=String((err&&(err.code||err.message))||"");
        console.error("❌ 存訂單失敗:",code);
        return /permission/i.test(code)?((sentBefore||connDrops!==drops0)?"unsure":"rejected"):"error";
      }).then(r=>{ delete inflight[key]; return r; });
    }
    const r=await Promise.race([inflight[key],sleep(waits[i]||waits[waits.length-1]).then(()=>"wait")]);
    if(r==="ok"){ markConfirmed(key); clearPending(key); return r; }
    if((r==="rejected"||r==="unsure")&&isConfirmed(key)){ clearPending(key); return "ok"; } // 別的分頁已確認存好
    if(r==="rejected"||r==="unsure"){ updatePending(key,{status:r}); return r; }
    if(onStatus) onStatus("retrying",i+1);
    if(r==="error") await sleep(1000*(i+1));  // 失敗：退避後重送同一個 key
    // r==="wait"：前一個 set 仍在佇列中（多半是離線），繼續等它，不重複送
  }
  return "timeout";
}
// 逐筆補送佇列裡還在等待的訂單（同時只跑一輪；每筆用自己的 key）
let flushing=null;
function flushQueue(onEach,opts){
  if(flushing) return flushing;
  flushing=withFlushLock(async()=>{
    const q=loadQueue();
    for(const e0 of Object.values(q).sort((a,b)=>(a.savedAt||0)-(b.savedAt||0))){
      const e=getPending(e0.key); // 等鎖期間別的分頁可能已處理
      if(!e){ onEach&&onEach(e0,isConfirmed(e0.key)?"ok":"gone"); continue; }
      if(Date.now()-(e.savedAt||0)>PENDING_MAX_AGE){ clearPending(e.key); continue; } // 超過 3 天不再補送
      if(e.status!=="pending"){ onEach&&onEach(e,e.status); continue; }
      onEach&&onEach(e,"saving");
      const r=await saveOrderReliably(e.key,e.order,opts);
      onEach&&onEach(e,r);
    }
  }).finally(()=>{flushing=null;});
  return flushing;
}

// 訂單日期 key（YYYY-MM-DD）：新訂單用 dateKey；舊訂單從 ts（例如 "2026/5/7 上午10:48:20"）解析
function orderDateKey(o){
  if(o&&o.dateKey) return o.dateKey;
  if(!o||!o.ts) return "未知日期";
  const datePart=String(o.ts).trim().split(" ")[0];
  const nums=datePart.split(/[\/\-]/).map(x=>parseInt(x,10));
  if(nums.length<3||nums.some(isNaN)) return datePart;
  return `${nums[0]}-${String(nums[1]).padStart(2,"0")}-${String(nums[2]).padStart(2,"0")}`;
}
const ORDER_DISPLAY_LIMIT=200; // 後台訂單列表最多顯示幾筆（分析頁一律使用全部訂單）

// 營業時間：週一至週六 10:30–19:00，週日公休
function isOpenNow(){
  const n=new Date(),day=n.getDay(),m=n.getHours()*60+n.getMinutes();
  return day!==0&&m>=10*60+30&&m<19*60;
}
function getDates(){
  const d=[];
  const now=new Date();
  // 正規化到當天中午 12:00（避免午夜時區/DST 邊界造成跳日）
  const cur=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0,0);
  while(d.length<12){
    if(cur.getDay()!==0)d.push(new Date(cur)); // 跳過週日
    cur.setDate(cur.getDate()+1);
  }
  return d;
}
const fmtDate=d=>d.toLocaleDateString("zh-TW",{month:"short",day:"numeric",weekday:"short"});
// fmtKey 用本地時區（不用 toISOString，因為那會轉成 UTC 造成跨時區跳日 bug）
const fmtKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isToday=d=>fmtKey(d)===fmtKey(new Date());
function getSlots(dt){
  const now=new Date(),slots=[],td=isToday(dt);
  if(dt.getDay()===0)return []; // 週日公休
  const openMin=10*60+30,closeMin=19*60;
  if(td){
    const nowMin=now.getHours()*60+now.getMinutes();
    if(nowMin>=openMin&&nowMin<closeMin)slots.push("盡快 ASAP");
  }
  for(let t=openMin;t<closeMin;t+=15){ // 19:00 打烊，最後一個時段 18:45
    if(td){const sd=new Date(now);sd.setHours(Math.floor(t/60),t%60,0,0);if(sd<=new Date(now.getTime()+600000))continue;}
    slots.push(`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`);
  }
  return slots;
}
const itemDiscPrice=(price,pct)=>Math.round(price*(1-(Number(pct)||0)/100));
function calcPromo(items,qty,promos){
  let disc=0;const discLines=[],addonList=[];
  const sub=items.reduce((s,i)=>s+i.price*qty(i.id),0);
  promos.filter(p=>p.active).forEach(p=>{
    if(p.type==="order_discount"){const d=Math.round(sub*(p.pct/100));disc+=d;discLines.push(`🎉 ${p.label}：-R${d}`);}
    // 品項折扣：先算「每份折後價」（四捨五入），再乘數量，跟菜單上顯示的折後價一致
    if(p.type==="item_discount"){items.filter(i=>i.id===p.itemId).forEach(i=>{const d=(i.price-itemDiscPrice(i.price,p.pct))*qty(i.id);disc+=d;discLines.push(`🎉 ${p.label}：-R${d}`);});}
    if(p.type==="addon")addonList.push(p);
  });
  return{disc,discLines,addonList};
}

// 外送平台取貨（客人自己叫 Uber／Bolt 到店取餐）：資料庫規則只允許 pickup 為 外帶／外送／內用，
// 所以新訂單仍存 pickup:"外送"，但不存地址與距離。舊的店家外送訂單一定有地址或距離，用這點區分。
const isCourierOrder=o=>!!o&&o.pickup==="外送"&&!o.addr&&!o.distance;
const pickupName=o=>isCourierOrder(o)?"外送平台取貨":(o&&o.pickup)||"";
// 後台用：依「目前」菜單（含改價、新商品）、促銷、外送費重新計算訂單應收金額，抓出被竄改的訂單
function repriceOrder(o,menuItems,promos,delivFee){
  const issues=[];
  const qmap={},pmap={};
  (o.items||[]).forEach(it=>{
    const q=Number(it.qty)||0;
    const m=(it.id&&menuItems.find(x=>x.id===it.id))||menuItems.find(x=>x.name===it.name);
    if(!m){
      issues.push(`找不到品項「${it.name}」（以客人提交的單價 R${it.price} 計）`);
      const k="?"+it.name; qmap[k]=(qmap[k]||0)+q; pmap[k]=Number(it.price)||0; return;
    }
    if(Number(it.price)!==m.price) issues.push(`${m.name} 單價 R${it.price}（菜單 R${m.price}）`);
    qmap[m.id]=(qmap[m.id]||0)+q; pmap[m.id]=m.price;
  });
  const items=Object.keys(qmap).map(id=>({id,price:pmap[id]}));
  const qf=id=>qmap[id]||0;
  const sub=items.reduce((s,i)=>s+i.price*qf(i.id),0);
  const {disc,addonList}=calcPromo(items,qf,promos);
  if((Number(o.disc)||0)>disc+1) issues.push(`折扣 R${o.disc}（依目前促銷應為 R${disc}）`);
  let addons=0;
  (o.addons||[]).forEach(a=>{
    const p=addonList.find(x=>x.addonName===a.addonName);
    const price=p?Number(p.addonPrice)||0:Number(a.addonPrice)||0;
    if(!p) issues.push(`加價購「${a.addonName}」目前沒有此促銷`);
    else if(Number(a.addonPrice)!==price) issues.push(`加價購「${a.addonName}」R${a.addonPrice}（應為 R${price}）`);
    addons+=price*(Number(a.qty)||0);
  });
  let fee=0;
  if(isCourierOrder(o)){
    if((Number(o.fee)||0)!==0) issues.push(`運費 R${Number(o.fee)||0}（外送平台取貨應為 R0）`);
  }else if(o.pickup==="外送"){
    const dN=parseFloat(o.distance);
    const free=(sub-disc+addons)>=1500&&Number.isFinite(dN)&&dN>0&&dN<=5;
    fee=free?0:(Number(delivFee)||0);
    if((Number(o.fee)||0)!==fee) issues.push(`外送費 R${Number(o.fee)||0}（應為 R${fee}）`);
  }
  const expected=sub-disc+addons+fee;
  const submitted=Number(o.total);
  const totalMismatch=!Number.isFinite(submitted)||Math.abs(submitted-expected)>1;
  return {expected,submitted,issues,flag:totalMismatch||issues.length>0,totalMismatch};
}

            <h1 className="jw-status__title">{saveStatus==="ok"?(fbNo?"訂單已提交（備援編號）":"訂單已提交！"):saveStatus==="saving"?"訂單送出中…":saveStatus==="unsure"?"訂單可能已送達，請確認":"訂單尚未送達店家"}</h1>
            <p className="jw-status__text">{saveStatus==="ok"?(fbNo?"Order submitted (backup number)":"Order Submitted!"):saveStatus==="saving"?"Sending your order…":saveStatus==="unsure"?"Your order may have reached the shop — please confirm":"Your order has NOT reached the shop yet"}</p>
            <p style={{marginTop:14}}><span style={{color:"var(--jw-text-muted)",marginRight:8}}>訂單編號</span><span className="jw-ordno">#{ordNo}</span></p>
            {fbNo&&<p id="fbNoNotice" style={{marginTop:10,padding:"8px 12px",borderRadius:10,border:"2px solid var(--jw-amber-main)",background:"var(--jw-amber-soft)",color:"var(--jw-amber-main)",fontWeight:700,fontSize:14,lineHeight:1.5}}>⚠️ 備援編號，請以店家回覆為準<br/><span style={{fontSize:13,fontWeight:500}}>Backup order number – please rely on the shop's reply</span></p>}
          </section>
          {saveStatus!=="ok"&&<div id="saveWarn" role="alert" style={{background:saveStatus==="saving"?"var(--jw-amber-soft)":"var(--jw-error-soft)",border:`2px solid ${saveStatus==="saving"?"var(--jw-amber-main)":"var(--jw-error-main)"}`,borderRadius:14,padding:"14px 16px",marginBottom:16,fontSize:15,color:saveStatus==="saving"?"var(--jw-amber-main)":"var(--jw-error-main)",lineHeight:1.6}}>
            {saveStatus==="saving"
              ?<>⏳ 正在把訂單 #{ordNo} 送到店家，請稍候，<strong>不要關閉此頁</strong>。<br/><span style={{fontSize:13,opacity:.9}}>Sending order #{ordNo} to the shop… please keep this page open.</span></>
              :saveStatus==="unsure"
              ?<>⚠️ 訂單 #{ordNo} <strong>可能已送達</strong>，但無法確認。請向店家確認編號 #{ordNo}，或按下方綠色按鈕用 WhatsApp 傳送。<br/><span style={{fontSize:13,opacity:.9}}>Order #{ordNo} may already have reached the shop, but we could not confirm it. Please check order #{ordNo} with the shop, or send it via WhatsApp below.</span></>
              :saveStatus==="rejected"
              ?<>⚠️ 訂單 #{ordNo} <strong>尚未送達店家</strong>（系統無法接受此訂單）。請按下方綠色按鈕用 WhatsApp 傳送訂單，並截圖此畫面。<br/><span style={{fontSize:13,opacity:.9}}>Order #{ordNo} has NOT reached the shop (the system could not accept it). Please send it via WhatsApp below and take a screenshot.</span></>
              :<>⚠️ 訂單 #{ordNo} <strong>尚未送達店家</strong>（網路不穩）。<br/>1. 請<strong>保持此頁開啟</strong>，系統會在網路恢復後自動重送；<br/>2. 也可以按「重新送出」；<br/>3. 若重送仍失敗，再按下方綠色按鈕用 WhatsApp 傳送訂單。<br/><span style={{fontSize:13,opacity:.9}}>Order #{ordNo} has NOT reached the shop yet (network problem). Keep this page open — it will resend automatically when you are back online, or tap “Retry”. If it still fails, send it via WhatsApp below.</span>
                 <button id="retrySave" onClick={retrySave} className="jw-btn jw-btn--primary" style={{marginTop:12,width:"100%"}}>🔄 重新送出 Retry</button></>}
          </div>}
          <div className="jw-panel" style={{marginBottom:16}}>
            <div style={{fontWeight:800,color:"var(--jw-amber-main)",marginBottom:8}}>{saveStatus==="ok"?"📱 正在開啟 WhatsApp… Opening WhatsApp…":"📱 重新送出仍失敗時，再按下方按鈕用 WhatsApp 傳送 · If retry fails, send via WhatsApp below"}</div>
            <div style={{fontSize:14,lineHeight:1.6,marginBottom:8}}>請在 WhatsApp 裡按<strong>「傳送」</strong>把訂單送給店家，我們收到後才會開始準備您的餐點。</div>
            <div style={{fontSize:13,color:"var(--jw-text-muted)",lineHeight:1.6}}>Please tap <strong>Send</strong> in WhatsApp to deliver your order to us. We will start preparing once we receive it.</div>
          </div>
          {/* 如果沒有自動跳轉，可以手動按這個按鈕 */}
          <a id="waLink" href={`https://wa.me/${WA}?text=${encodeURIComponent(submittedTxt||orderTxt(ordNo,fbNo))}`} className="jw-btn jw-btn--wa" style={{flexDirection:"column",textDecoration:"none",minHeight:64,gap:2}}>
            <span style={{display:"flex",gap:8,alignItems:"center"}}><Ico n="msg"/>沒有跳轉？點此打開 WhatsApp</span>
            <span style={{fontSize:12,fontWeight:500}}>Not redirected? Tap to open WhatsApp</span>
          </a>
          {/* 備案：複製訂單文字 */}
          <button
            onClick={()=>{
              const txt=submittedTxt||orderTxt(ordNo,fbNo);
              if(navigator.clipboard){
                navigator.clipboard.writeText(txt).then(()=>{
                  setCopied(true);
                  setTimeout(()=>setCopied(false),2500);
                });
              }else{
                const t=document.createElement("textarea");
                t.value=txt;document.body.appendChild(t);t.select();
                document.execCommand("copy");document.body.removeChild(t);
                setCopied(true);
                setTimeout(()=>setCopied(false),2500);
              }
            }}
            className="jw-btn jw-btn--secondary" style={{marginTop:10,...(copied?{borderColor:"var(--jw-success-main)",color:"var(--jw-success-main)"}:{})}}
          >
            <Ico n={copied?"check":"copy"} s={18}/>{copied?"✓ 已複製！可以手動貼到 WhatsApp":"📋 或：複製訂單文字（手動貼到 WhatsApp）"}
          </button>
          {isInAppBrowser()&&<div className="jw-panel" style={{borderColor:"var(--jw-amber-main)",marginTop:12,fontSize:13,lineHeight:1.5}}>
            ⚠️ 偵測到您在 App 內建瀏覽器（如 WeChat、Facebook、Instagram、Line）。如果沒有自動跳轉到 WhatsApp，請：<br/>
            1. 點上方「📋 複製訂單文字」<br/>
            2. 打開 WhatsApp 搜尋「江味齋」<br/>
            3. 長按輸入框→貼上→發送
          </div>}
          <div style={{textAlign:"center",marginTop:8}}><button onClick={reset} className="jw-btn jw-btn--ghost">+ 新增訂單 New Order</button></div>
        </main>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

// PWA Service Worker 註冊（強制檢查更新）
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    console.log("✅ Service Worker 已註冊");
    
    // 每次載入時主動檢查更新
    reg.update();
    
    // 偵測到新版本時，自動套用
    reg.addEventListener("updatefound", ()=>{
      const newWorker = reg.installing;
      if(newWorker){
        newWorker.addEventListener("statechange", ()=>{
          if(newWorker.state === "installed" && navigator.serviceWorker.controller){
            console.log("🆕 偵測到新版本，正在套用...");
            // 通知新 SW 立即接管
            newWorker.postMessage("SKIP_WAITING");
          }
        });
      }
    });
    
    // 當新 SW 接管時，自動重新載入頁面
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshing) return;
      refreshing = true;
      console.log("🔄 重新載入以套用新版本");
      window.location.reload();
    });
  }).catch(err=>{
    console.warn("⚠️ Service Worker 註冊失敗:", err);
  });
}
</script>
</body>
</html>
